[project]
name = "session-manager"
version = "0.1.0"
description = "Context Session Manager MCP server with PTY wrapper for Claude Code"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.27",
    "pexpect>=4.9",
    "pyte>=0.8.2",
]

[project.scripts]
ccode = "session_manager.wrapper.main:main"
ccode-hook-user-prompt-submit = "session_manager.hooks.user_prompt_submit:main"
ccode-hook-pre-tool-use = "session_manager.hooks.pre_tool_use:main"
ccode-hook-pre-compact = "session_manager.hooks.pre_compact:main"
ccode-hook-stop = "session_manager.hooks.stop:main"
ccode-statusline = "session_manager.statusline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/session_manager"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
